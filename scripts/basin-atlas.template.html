<style>

  --fixed:#3B5BDB; --cycle:#0B8A7A; --ray:#C27400; --helix:#8E44AD; --spiral:#C92A2A;
  --inert:#C9D0D8; --other:#6B7480; --origin:#1B2430; --path:#1B2430;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161B; --panel:#1A2027; --ink:#E7ECF2; --ink-2:#B4BEC9; --ink-3:#7F8B98;
    --edge:#2E3740; --tab:#232B34; --grid:#2A323C; --halo:#12161B;
    --fixed:#7A93F0; --cycle:#3FC2B0; --ray:#E9A03A; --helix:#C58BE0; --spiral:#F06A6A;
    --inert:#343D48; --other:#8A94A0; --origin:#E7ECF2; --path:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --paper:#12161B; --panel:#1A2027; --ink:#E7ECF2; --ink-2:#B4BEC9; --ink-3:#7F8B98;
  --edge:#2E3740; --tab:#232B34; --grid:#2A323C; --halo:#12161B;
  --fixed:#7A93F0; --cycle:#3FC2B0; --ray:#E9A03A; --helix:#C58BE0; --spiral:#F06A6A;

}

body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 64px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:38px;line-height:1.05;margin:0 0 6px;letter-spacing:-.01em}
h2{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:26px;margin:44px 0 6px;letter-spacing:-.01em}
h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;margin:0 0 4px}
p{max-width:70ch}

/* map with axis labels */
.map{position:relative;display:grid;grid-template-columns:30px 1fr;grid-template-rows:1fr 22px;gap:0}
.map canvas{grid-column:2;grid-row:1;width:100%;aspect-ratio:1/1;display:block;border-radius:3px;cursor:crosshair;image-rendering:pixelated}
.map .ay{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-right:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3)}
.map .ax{grid-column:2;grid-row:2;display:flex;justify-content:space-between;padding-top:4px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--ink-3)}
.map .ay b,.map .ax b{color:var(--ink);font-weight:500}
.map.small{grid-template-columns:1fr;grid-template-rows:1fr}
.map.small canvas{grid-column:1;cursor:pointer}
.map.small .ax,.map.small .ay{display:none}

.guide-old{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:20px}

.readout{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--ink-2);min-height:3.2em;background:var(--paper);border:1px solid var(--edge);border-radius:4px;padding:8px 10px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.readout b{color:var(--ink);font-weight:500}
.rules{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;border-collapse:collapse;margin-top:8px}
.rules td{padding:2px 10px 2px 0;color:var(--ink-2);white-space:nowrap}
.rules td:first-child{color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:10px 0 0}
.keys i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.keys .mk{display:inline-block;width:14px;text-align:center;margin-right:4px;color:var(--ink);font-weight:600}

.family{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px;align-items:start;margin:18px 0 30px}

.family .ex{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,1fr));gap:12px;align-items:start}

.tile{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:10px;cursor:pointer}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:10px 14px}
.stat .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:20px;font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:10px;cursor:pointer}

.legend{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);margin-top:8px}

<div class="wrap">
<h1>Basin Atlas</h1>
<p class="lede">A basin map answers one question for one universe: <em>if it starts here, where does it end up?</em> Every square is a starting state; its colour is the destination. Move the mouse over the map to trace the path from that start.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="panel"></div>
</div>
<script>
const DATA = __DATA__;
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
const fmt = n => n.toLocaleString("en-US");
const KIND_VAR = {fixed:"--fixed", cycle:"--cycle", ray:"--ray", helix:"--helix", spiral:"--spiral", undecided:"--other", inert:"--inert", other:"--other"};
const SUB = ["₀","₁","₂"];

// ---- theme colours, read once (getComputedStyle inside draw loops was the slowness) ----
let C = {};
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["paper","panel","ink","ink-2","ink-3","grid","halo","fixed","cycle","ray","helix","spiral","inert","other","origin","path"]) C[k] = cs.getPropertyValue("--"+k).trim();
}
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b); let h=0, s=0; const l=(max+min)/2;
  if (max!==min){ const d=max-min; s = l>0.5 ? d/(2-max-min) : d/(max+min);
    h = max===r ? (g-b)/d + (g<b?6:0) : max===g ? (b-r)/d + 2 : (r-g)/d + 4; h/=6; }
  return [h*360, s*100, l*100];
}
// One colour per destination. Same kind = same hue; neighbours in position get clearly different lightness.
function classColors(m){
  if (m._colors) return m._colors;
  const byKind = {};
  m.classes.forEach((c,i) => { (byKind[c.kind] = byKind[c.kind] || []).push(i); });
  const cols = new Array(m.classes.length);
  const LEVELS = [0, -18, 16, -9, 24, -26, 8], HUES = [0, -16, 14, -8, 22, -22, 6];
  for (const [kind, idx] of Object.entries(byKind)){
    const base = C[kind === "undecided" ? "other" : kind] || C.other;
    if (kind === "inert" || kind === "other"){ idx.forEach(i => cols[i] = base); continue; }
    const [h,s,l] = hexToHsl(base);
    const sorted = idx.slice().sort((a,b) => { const x = m.classes[a].id, y = m.classes[b].id; for (let k=0;k<x.length;k++) if (x[k]!==y[k]) return x[k]-y[k]; return 0; });
    sorted.forEach((i, r) => { const k = idx.length === 1 ? 0 : r % LEVELS.length; cols[i] = `hsl(${(h + HUES[k] + 360) % 360} ${s}% ${Math.min(82, Math.max(26, l + LEVELS[k]))}%)`; });
  }
  return m._colors = cols;
}
const vec = v => "(" + v.join(", ") + ")";
function classText(c){
  switch (c.kind){
    case "fixed": return `stops at ${vec(c.id)}`;
    case "cycle": return `cycle through ${vec(c.id)}`;
    case "ray": return `escapes, direction ${vec(c.id)}`;
    case "helix": return `escapes with a twist, shift ${vec(c.id)}`;
    case "spiral": return "spirals outward";
    case "inert": return "frozen: already a fixed point, nothing else leads here";
    case "other": return "other destinations";
    default: return c.kind;
  }
}
// ---- the model ----
function decodeRows(index, N){
  let x = BigInt(index); const digits = [];
  for (let i = 0; i < 2*N*N; i++){ digits.push(Number(x % 3n) - 1); x /= 3n; }
  digits.reverse();
  const pos = [], neg = [];
  for (let f = 0; f < N; f++) pos.push(digits.slice(f*N, f*N+N));
  for (let f = 0; f < N; f++) neg.push(digits.slice(N*N + f*N, N*N + f*N + N));
  return {pos, neg, N};
}
function drift(R, v){
  const d = new Array(R.N).fill(0);
  for (let f = 0; f < R.N; f++){ const row = v[f] > 0 ? R.pos[f] : v[f] < 0 ? R.neg[f] : null; if (row) for (let e = 0; e < R.N; e++) d[e] += row[e]; }
  return d;
}
function trajectory(R, start, radius, limit = 600){
  const pts = [start.slice()], seen = new Map([[start.join(","), 0]]);
  let v = start.slice(), lastD = null;
  for (let t = 1; t <= limit; t++){
    const d = drift(R, v);
    if (d.every(x => x === 0)) return {pts, end: "fixed"};
    const w = v.map((x,i) => x + d[i]); lastD = d;
    const key = w.join(",");
    if (seen.has(key)){ pts.push(w); return {pts, end: "cycle", period: t - seen.get(key), first: seen.get(key)}; }
    seen.set(key, t); pts.push(w); v = w;
    if (w.some(x => Math.abs(x) > radius * 3 + 6)) return {pts, end: "escapes", dir: d};
  }
  return {pts, end: "long", dir: lastD};
}
function describe(tr, R, N){
  const s = tr.pts[0], n = tr.pts.length - 1;
  const head = `start ${vec(s)}`;
  const steps = tr.pts.slice(1, 9).map(vec).join(" → ") + (n > 8 ? " → …" : "");
  let tail;
  switch (tr.end){
    case "fixed": tail = n === 0 ? `<b>already a fixed point</b>: every value is zero or its rows cancel, nothing changes` : `<b>stops after ${n} step${n>1?"s":""} at ${vec(tr.pts[n])}</b>`; break;
    case "cycle": tail = `<b>enters a cycle of period ${tr.period}</b> after ${tr.first} step${tr.first===1?"":"s"}: it returns to ${vec(tr.pts[n])}`; break;
    case "escapes": tail = `<b>leaves for good</b>, drifting ${vec(tr.dir)} every step once it is far enough out`; break;
    default: tail = `<b>still going after ${n} steps</b>`;
  }
  return `${head}${n ? " → " + steps : ""}\n${tail}`;
}
function rulesTable(R){
  const N = R.N;
  let rows = "";
  for (let f = 0; f < N; f++){
    rows += `<tr><td>v${SUB[f]} &gt; 0</td><td>add ${vec(R.pos[f])}</td></tr><tr><td>v${SUB[f]} &lt; 0</td><td>add ${vec(R.neg[f])}</td></tr>`;
  }
  return `<table class="rules">${rows}</table><div class="hint" style="margin-top:6px">Each step adds up the rows of every coordinate that is not zero. A zero coordinate contributes nothing.</div>`;
}

// ---- drawing ----
function cellIndex(m, radius, N, x, y, z){
  const side = 2*radius+1;
  return N === 2 ? (x+radius)*side + (y+radius) : ((x+radius)*side + (y+radius))*side + (z+radius);
}
function drawBase(canvas, m, radius, N, sliceZ, big){
  const side = 2*radius+1, ctx = canvas.getContext("2d");
  const px = Math.floor(canvas.width / side), off = Math.floor((canvas.width - px*side)/2);
  const colors = classColors(m);
  ctx.fillStyle = C.paper; ctx.fillRect(0,0,canvas.width,canvas.height);
  const cells = m.cells;
  for (let x = -radius; x <= radius; x++) for (let y = -radius; y <= radius; y++){
    const cls = GLYPHS.indexOf(cells[cellIndex(m, radius, N, x, y, sliceZ)]);
    ctx.fillStyle = colors[cls];
    ctx.fillRect(off + (x+radius)*px, off + (radius - y)*px, px, px);
  }
  if (big){
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.globalAlpha = 0.6; ctx.beginPath();
    for (let i = 0; i <= side; i++){ ctx.moveTo(off + i*px + .5, off); ctx.lineTo(off + i*px + .5, off + side*px); ctx.moveTo(off, off + i*px + .5); ctx.lineTo(off + side*px, off + i*px + .5); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // axes through the origin
  ctx.strokeStyle = C.origin; ctx.lineWidth = big ? 1.5 : 1; ctx.globalAlpha = 0.5; ctx.beginPath();
  ctx.moveTo(off + radius*px + px/2, off); ctx.lineTo(off + radius*px + px/2, off + side*px);
  ctx.moveTo(off, off + radius*px + px/2); ctx.lineTo(off + side*px, off + radius*px + px/2);
  ctx.stroke(); ctx.globalAlpha = 1;
  // destination markers: ● fixed point, ○ cycle, → escape direction
  const cx = x => off + (x+radius)*px + px/2, cy = y => off + (radius - y)*px + px/2;
  const r = Math.max(2.5, px*0.36);
  const centroids = {};
  for (let x = -radius; x <= radius; x++) for (let y = -radius; y <= radius; y++){
    const cls = GLYPHS.indexOf(cells[cellIndex(m, radius, N, x, y, sliceZ)]);
    const k = m.classes[cls].kind; if (k !== "ray" && k !== "helix") continue;
    const c = centroids[cls] = centroids[cls] || {x:0,y:0,n:0}; c.x += x; c.y += y; c.n++;
  }
  m.classes.forEach((c, i) => {
    if (c.kind === "fixed" || c.kind === "cycle"){
      if (N === 3 && c.id[2] !== sliceZ) return;
      if (Math.abs(c.id[0]) > radius || Math.abs(c.id[1]) > radius) return;
      ctx.beginPath(); ctx.arc(cx(c.id[0]), cy(c.id[1]), r, 0, Math.PI*2);
      ctx.lineWidth = Math.max(1.2, px*0.14); ctx.strokeStyle = C.halo; ctx.stroke();
      if (c.kind === "fixed"){ ctx.fillStyle = C.ink; ctx.fill(); } else { ctx.lineWidth = Math.max(1, px*0.1); ctx.strokeStyle = C.ink; ctx.stroke(); }
    } else if ((c.kind === "ray" || c.kind === "helix") && centroids[i] && centroids[i].n >= 6){
      const ce = centroids[i], X = cx(ce.x/ce.n), Y = cy(ce.y/ce.n);
      const dx = c.id[0], dy = -c.id[1], len = Math.hypot(dx,dy) || 1, L = Math.max(px*2.2, 14);
      const ex = X + dx/len*L, ey = Y + dy/len*L;
      ctx.lineWidth = Math.max(1.5, px*0.18); ctx.strokeStyle = C.halo; arrow(ctx, X, Y, ex, ey, Math.max(4, px*0.6), c.kind === "helix");
      ctx.lineWidth = Math.max(1, px*0.11); ctx.strokeStyle = C.ink; arrow(ctx, X, Y, ex, ey, Math.max(4, px*0.6), c.kind === "helix");
    }
  });
  canvas._geom = {px, off, radius, N, sliceZ};
}
function arrow(ctx, x0, y0, x1, y1, head, dashed){
  if (dashed) ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); ctx.setLineDash([]);
  const a = Math.atan2(y1-y0, x1-x0);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1 - head*Math.cos(a - .5), y1 - head*Math.sin(a - .5)); ctx.moveTo(x1,y1); ctx.lineTo(x1 - head*Math.cos(a + .5), y1 - head*Math.sin(a + .5)); ctx.stroke();
}
// Base image cached in an offscreen canvas so hover redraws are a blit + a polyline.
function ensureBase(canvas, m, radius, N, sliceZ, big){
  const key = `${m.index}|${sliceZ}|${canvas.width}|${C.ink}`;
  if (canvas._baseKey !== key){
    const b = document.createElement("canvas"); b.width = canvas.width; b.height = canvas.height;
    drawBase(b, m, radius, N, sliceZ, big); canvas._base = b; canvas._geom = b._geom; canvas._baseKey = key;
  }
  return canvas._base;
}
function drawMap(canvas, m, radius, N, sliceZ, big, tr){
  const base = ensureBase(canvas, m, radius, N, sliceZ, big);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(base, 0, 0);
  if (!tr) return;
  const {px, off} = canvas._geom;
  const cx = x => off + (x+radius)*px + px/2, cy = y => off + (radius - y)*px + px/2;
  const P = tr.pts;
  const onSlice = p => N === 2 || p[2] === sliceZ;
  const stroke = (w, col) => { ctx.lineWidth = w; ctx.strokeStyle = col; ctx.beginPath();
    for (let i = 0; i < P.length; i++){ const p = P[i]; if (i === 0) ctx.moveTo(cx(p[0]), cy(p[1])); else ctx.lineTo(cx(p[0]), cy(p[1])); }
    ctx.stroke(); };
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  stroke(Math.max(4, px*0.45), C.halo); stroke(Math.max(1.6, px*0.18), C.path);
  const rr = Math.max(2, px*0.22);
  for (let i = 0; i < P.length; i++){
    const p = P[i]; ctx.beginPath(); ctx.arc(cx(p[0]), cy(p[1]), i === 0 ? rr*1.6 : rr, 0, Math.PI*2);
    ctx.fillStyle = onSlice(p) ? C.path : C.halo; ctx.fill();
    if (!onSlice(p)){ ctx.lineWidth = 1; ctx.strokeStyle = C.path; ctx.stroke(); }
  }
  const last = P[P.length-1];
  if (tr.end === "fixed"){ ctx.beginPath(); ctx.arc(cx(last[0]), cy(last[1]), rr*2.2, 0, Math.PI*2); ctx.lineWidth = 2; ctx.strokeStyle = C.path; ctx.stroke(); }
  if (tr.end === "escapes" && P.length > 1){ const q = P[P.length-2]; ctx.lineWidth = Math.max(1.6, px*0.18); ctx.strokeStyle = C.path; arrow(ctx, cx(q[0]), cy(q[1]), cx(last[0]), cy(last[1]), Math.max(6, px*0.8), false); }
}
// Build an interactive map element. Hover traces the path; `readout` (optional) receives the description.
function mapElement(m, N, radius, size, opts = {}){
  const wrap = document.createElement("div"); wrap.className = "map" + (opts.small ? " small" : "");
  const side = 2*radius+1;
  const px = Math.max(1, Math.round(size / side));
  wrap.innerHTML = `<div class="ay"><span><b>v${SUB[1]}</b> ${radius}</span><span>0</span><span>−${radius}</span></div><canvas width="${px*side}" height="${px*side}" role="img" aria-label="basin map of universe ${m.index}"></canvas><div class="ax"><span>−${radius}</span><span>0</span><span>${radius} <b>v${SUB[0]}</b></span></div>`;
  const cv = wrap.querySelector("canvas");
  cv._m = m; cv._slice = opts.slice || 0; cv._big = !opts.small;
  const R = decodeRows(m.index, N);
  const redraw = tr => drawMap(cv, m, radius, N, cv._slice, cv._big, tr);
  cv._redraw = () => redraw(cv._tr);
  if (!opts.lazy) cv._redraw();
  if (opts.hover !== false){
    cv.addEventListener("mousemove", e => {
      const g = cv._geom; if (!g) return;
      const rect = cv.getBoundingClientRect(), sx = cv.width / rect.width;
      const x = Math.floor(((e.clientX - rect.left)*sx - g.off) / g.px) - radius, y = radius - Math.floor(((e.clientY - rect.top)*sx - g.off) / g.px);
      if (Math.abs(x) > radius || Math.abs(y) > radius) return;
      const start = N === 2 ? [x, y] : [x, y, cv._slice];
      if (cv._tr && cv._tr.pts[0].join(",") === start.join(",")) return;
      cv._tr = trajectory(R, start, radius); redraw(cv._tr);
      if (opts.readout) opts.readout.innerHTML = describe(cv._tr, R, N);
    });
    cv.addEventListener("mouseleave", () => { cv._tr = null; redraw(null); if (opts.readout && !opts.keepReadout) opts.readout.innerHTML = opts.idle || ""; });
  }
  return wrap;
}
function findMap(size, index){ return DATA[size].maps.find(m => m.index === index); }
function summarize(m){
  const real = m.classes.filter(c => c.kind !== "inert" && c.kind !== "other");
  const kinds = {}; real.forEach(c => kinds[c.kind] = (kinds[c.kind]||0)+1);
  const parts = Object.entries(kinds).map(([k,n]) => n === 1 ? ({fixed:"1 fixed point", cycle:"1 cycle", ray:"1 escape direction", helix:"1 helix", spiral:"1 spiral"})[k] || k : `${n} ${({fixed:"fixed points", cycle:"cycles", ray:"escape directions", helix:"helices", spiral:"spirals"})[k] || k}`);
  const inert = m.classes.find(c => c.kind === "inert");
  if (inert) parts.push(`${inert.n} frozen cells`);
  return parts.join(", ") || "nothing reachable";
}
function legendHtml(m, max = 6){
  const colors = classColors(m);
  const real = m.classes.map((c,i)=>[c,i]).filter(([c]) => c.kind !== "inert" && c.kind !== "other");
  const inert = m.classes.map((c,i)=>[c,i]).filter(([c]) => c.kind === "inert" || c.kind === "other");
  const row = ([c,i]) => `<div><i style="background:${colors[i]}"></i>${classText(c)} <code>${c.n} start${c.n===1?"":"s"}</code></div>`;
  return `<div class="legend">${real.slice(0,max).map(row).join("")}${real.length>max?`<div class="hint">+${real.length-max} more destinations of the same kinds</div>`:""}${inert.map(row).join("")}</div>`;
}

// ---- tabs: one universe rendered at a time ----
const TABS = [
  {id: "guide", label: "How to read", size: "2", ids: [52],
   html: m => `<ol>
      <li>The map is the plane of starting states. Right is larger <b>v${SUB[0]}</b>, up is larger <b>v${SUB[1]}</b>; the crossing lines are the axes through (0, 0).</li>
      <li>Each square is one start. Its colour says which destination that start reaches.</li>
      <li>Destinations are marked on the map: <span class="mk">●</span>a fixed point, <span class="mk">○</span>a cycle, <span class="mk">→</span>an escape direction, drawn inside the region that escapes that way.</li>
      <li>The universe's rule is below. It is the same rule everywhere; the shape comes only from which coordinates are positive or negative.</li>
    </ol>
    <div class="keys"><span><i style="background:${C.fixed}"></i>stops at a fixed point</span><span><i style="background:${C.cycle}"></i>enters a cycle</span><span><i style="background:${C.ray}"></i>escapes in a straight direction</span><span><i style="background:${C.helix}"></i>escapes with a twist</span><span><i style="background:${C.inert}"></i>frozen cell</span></div>`},
  {id: "sectors", label: "Sectors", size: "2", ids: [52, 2320, 5520, 1146],
   html: () => `<p>The fate depends only on the direction of the start, not its distance. Boundaries are straight lines through the origin, so the map looks like pie slices.</p><p class="why">Far from the axes the rule never changes, so the motion is a straight line. Only which side of an axis you start on matters. 55% of size-2 universes look like this.</p>`},
  {id: "stripes", label: "Stripes", size: "2", ids: [398, 89, 38, 656],
   html: () => `<p>A whole line of fixed points, each with its own thin basin. Neighbouring starts land on neighbouring fixed points.</p><p class="why">Some combination of the coordinates, for example v₀ + v₁, is unchanged by every step the path takes. Each value of that sum has its own destination, so the basins are parallel stripes. 40% of size-2 universes have a stripe family.</p>`},
  {id: "checker", label: "Checkerboards", size: "2", ids: [560, 506, 224, 62],
   html: () => `<p>Adjacent starts go to different places, alternating like a chess board.</p><p class="why">A step of size 2 lands exactly on zero from an even value and jumps over it from an odd one. Parity decides the fate. Universe 560 is the pure case: two cycles, chosen by whether v₀ + v₁ is even or odd. Only 8 of 873 universes do this.</p>`},
  {id: "frozen", label: "Frozen blocks", size: "2", ids: [1312, 2551, 3280],
   html: () => `<p>Grey regions where every start is already a fixed point: nothing moves there, and nothing from outside arrives.</p><p class="why">In that quadrant the active rows cancel to zero, so the rule does nothing. Universe 3280 is the all-zero rule: the whole plane is frozen.</p>`},
  {id: "s2", label: "All size 2", size: "2", browse: true},
  {id: "s3", label: "All size 3", size: "3", browse: true},
];
const SORTS = {
  simple: {label: "simplest first (few destinations)", key: m => (m.f.moving + m.f.sinks) * 10 + m.f.boundary, tie: m => m.index},
  rich: {label: "most destinations first", key: m => -(m.f.moving + m.f.sinks), tie: m => m.index},
  moving: {label: "most cycles / escapes", key: m => -m.f.moving, tie: m => m.index},
  stripes: {label: "most checkerboard", key: m => -m.f.stripes, tie: m => m.index},
  conic: {label: "least sector-like", key: m => m.f.conic, tie: m => -(m.f.moving + m.f.sinks)},
  inert: {label: "most frozen cells", key: m => -m.f.inert, tie: m => m.index},
  index: {label: "by index", key: m => m.index, tie: m => 0},
};
const state = {tab: "guide", current: {}, sort: "simple", kind: "any", find: "", slice: 0};

function browseList(tab){
  const d = DATA[tab.size];
  let maps = d.maps.slice();
  if (state.kind !== "any") maps = maps.filter(m => m.classes.some(c => c.kind === state.kind));
  if (state.find !== ""){ const q = Number(state.find); maps = maps.filter(m => String(m.index).startsWith(String(q))); }
  const srt = SORTS[state.sort];
  maps.sort((a,b) => srt.key(a) - srt.key(b) || srt.tie(a) - srt.tie(b));
  return maps;
}
function currentIndex(tab, list){
  const cur = state.current[tab.id];
  if (cur !== undefined && list.some(m => m.index === cur)) return cur;
  return list.length ? list[0].index : undefined;
}
function showTab(){
  const tab = TABS.find(t => t.id === state.tab), N = Number(tab.size), d = DATA[tab.size], radius = d.summary.radius, s = d.summary;
  const list = tab.browse ? browseList(tab) : tab.ids.map(i => findMap(tab.size, i)).filter(Boolean);
  const idx = currentIndex(tab, list);
  state.current[tab.id] = idx;
  const m = idx === undefined ? null : findMap(tab.size, idx);
  const panel = document.getElementById("panel");
  const pos = list.findIndex(x => x.index === idx);
  let picker;
  if (tab.browse){
    picker = `
      <div class="summary">
        <div class="stat"><div class="n">${fmt(s.universes)}</div><div class="k">${d.sampled ? "sampled universes, one per symmetry class" : "universes, one per symmetry class"}; starts in [−${radius}, ${radius}]<sup>${N}</sup></div></div>
        <div class="stat"><div class="n">${(100*s.conic/s.universes).toFixed(1)}%</div><div class="k">sector maps: only the direction of the start matters</div></div>
        <div class="stat"><div class="n">${(100*s.multi/s.universes).toFixed(1)}%</div><div class="k">two or more reachable destinations</div></div>
        <div class="stat"><div class="n">${(100*s.checker/s.universes).toFixed(1)}%</div><div class="k">checkerboards: parity decides the fate</div></div>
      </div>
      <div class="controls">
        <label>sort <select id="sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${k===state.sort?"selected":""}>${v.label}</option>`).join("")}</select></label>
        <label>contains <select id="kind">${["any","fixed","cycle","ray","helix","spiral"].map(k=>`<option ${k===state.kind?"selected":""}>${k}</option>`).join("")}</select></label>
        <label>universe # <input id="find" type="number" min="0" placeholder="index" value="${state.find}"></label>
      </div>
      <div class="pn"><button id="prev" ${pos<=0?"disabled":""}>← prev</button><button id="next" ${pos<0||pos>=list.length-1?"disabled":""}>next →</button><span>${pos+1} of ${fmt(list.length)}</span></div>
      <div class="list" id="list">${list.slice(0, 400).map(x => `<div class="row${x.index===idx?" on":""}" data-i="${x.index}"><b>${x.index}</b><span>${summarize(x)}</span></div>`).join("")}${list.length>400?`<div class="row"><span class="hint">${fmt(list.length-400)} more: narrow with the filters or type an index</span></div>`:""}</div>`;
  } else {
    picker = `<div class="picks">${list.map(x => `<button aria-pressed="${x.index===idx}" data-i="${x.index}">universe ${x.index}</button>`).join("")}</div>`;
  }
  panel.innerHTML = `<div class="panel"><div id="vmap"></div><div>
    ${tab.html ? tab.html(m) : ""}
    ${picker}
    ${m ? `<div class="title">Universe ${m.index}</div><div class="hint">${summarize(m)}</div>
    ${N===3 ? `<div class="controls" style="margin:10px 0 4px"><label>slice v${SUB[2]} = <span id="slv">${state.slice}</span> <input id="slice" type="range" min="-${radius}" max="${radius}" value="${state.slice}"></label><span class="hint">size 3 starts fill a cube; the map is one slice of it</span></div>` : ""}
    ${rulesTable(decodeRows(m.index, N))}
    ${legendHtml(m, 8)}
    <div class="readout" id="readout">hover the map to trace a path</div>
    <p class="hint" style="margin-top:12px">Replay a start on the command line: <code>system show --size ${N} --index ${m.index} --start v0,v1${N===3?",v2":""}</code></p>` : `<div class="hint">no universe matches</div>`}
  </div></div>`;
  if (m){
    const readout = document.getElementById("readout");
    const el = mapElement(m, N, radius, 640, {readout, slice: N === 3 ? state.slice : 0, idle: "hover the map to trace a path"});
    panel.querySelector("#vmap").appendChild(el);
    const sl = document.getElementById("slice");
    if (sl) sl.oninput = e => { const cv = el.querySelector("canvas"); state.slice = cv._slice = Number(e.target.value); cv._tr = null; document.getElementById("slv").textContent = state.slice; cv._redraw(); };
  }
  const pick = i => { state.current[tab.id] = i; showTab(); };
  panel.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => pick(Number(b.dataset.i))));
  const on = panel.querySelector(".row.on"); if (on) on.scrollIntoView({block: "nearest"});
  const q = id => document.getElementById(id);
  if (tab.browse){
    q("sort").onchange = e => { state.sort = e.target.value; showTab(); };
    q("kind").onchange = e => { state.kind = e.target.value; showTab(); };
    q("find").onchange = e => { state.find = e.target.value; showTab(); };
    q("prev").onclick = () => pick(list[pos-1].index);
    q("next").onclick = () => pick(list[pos+1].index);
  }
}
function buildTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = TABS.map(x => `<button role="tab" aria-selected="${x.id===state.tab}" data-tab="${x.id}">${x.label}</button>`).join("");
  t.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; buildTabs(); showTab(); }));
}
readTheme();
buildTabs();
showTab();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); for (const d of Object.values(DATA)) for (const x of d.maps) x._colors = null; showTab(); });
</script>
